[package]
name    = "nxk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AArch64 microkernel for Tegra X1 (Nintendo Switch), no host OS"

[features]
default = ["spectre-v2"]
# Branch predictor invalidated on every process switch
# (CVE-2017-5715, Cortex-A57).
spectre-v2 = []
# Idle cores poll instead of WFI (like idle=poll on Linux): no IPI to wake
# them. Used to compare with L4T, which only runs under the emulator with
# idle=poll.
idle-poll = []
# Scheduling decisions traced on the console (diagnostics).
trace-sched = []

[dependencies]
nxk-abi = { path = "../abi" }

[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
panic            = "abort"
debug            = true      # symbols kept for gdb, stripped from the loaded binary
overflow-checks  = false
strip            = false

[profile.dev]
panic = "abort"
