[package]
name = "luna"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Amazon Luna as an nxk game catalog: sign-in, the games an account can play, their covers"

[dependencies]
lunacore = { path = "../lunacore" }
nxhttp = { path = "../nxhttp" }
nxdtls = { path = "../nxdtls" }
nxopus = { path = "../nxopus" }
nxh264 = { path = "../nxh264" }
prost = "0.14"
nxsvc = { path = "../nxsvc" }
nxgfx = { path = "../../jeux/nxgfx" }
nxk-abi = { path = "../../abi" }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
