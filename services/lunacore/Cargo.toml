[package]
name = "lunacore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Amazon Luna for nxk, the part with no I/O: requests, replies, the catalog, covers (cargo test on the PC)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
prost = "0.14"
