[package]
name = "nxeap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "802.1X EAP-PEAPv0/v1 (EAP-MSCHAPv2) supplicant"

[dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
hmac = { version = "0.12", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
