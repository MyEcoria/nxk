[workspace]
resolver = "2"
members = ["libnx", "init", "console", "shell", "hello", "ipcbench", "crash", "fptest", "bench", "true", "ktest", "clk", "i2c", "power", "sd", "fs", "display", "input", "usb", "usbcon", "net", "nettest"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
panic = "abort"
