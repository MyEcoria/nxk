[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=0
autonogc=1
updater2p=0
bootprotect=0

# STAGE 2 (L4T chain): the `bootloader/ini/nxk.ini` entry starts
# nxk/bl31.bin (the nxk-bl31 monitor, see hwboot/nxk-bl31/), which copies
# nxk/bl33.bin (= nxk.bin) to 0x80000000 and jumps there in EL2. Neither
# direct RCM nor `payload=` can start nxk (a 2 MB DRAM image).
