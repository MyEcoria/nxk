# Ordinary Rust programs (with std) for nxk.
#
# Build: tools/build.sh (or here: cargo build --release), with the
# "nxk" toolchain prepared by tools/mkstd.py (ported standard library).
[workspace]
resolver = "2"
members = ["hello", "stdtest"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
